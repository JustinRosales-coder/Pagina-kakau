    <linearGradient id="choc3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A5F2E"/>
      <stop offset="0.5" stop-color="#6B4520"/>
      <stop offset="1" stop-color="#4E3016"/>
    </linearGradient>
    <radialGradient id="light3" cx="0.35" cy="0.28" r="0.7">
