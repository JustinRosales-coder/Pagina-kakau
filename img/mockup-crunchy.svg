<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1A12"/>
      <stop offset="0.5" stop-color="#1A100B"/>
      <stop offset="1" stop-color="#0F0907"/>
    </linearGradient>
    <linearGradient id="choc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B4423"/>
      <stop offset="0.5" stop-color="#4E3018"/>
      <stop offset="1" stop-color="#3A2211"/>
    </linearGradient>
    <radialGradient id="light" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#E6C280" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#E6C280" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#light)"/>

  <!-- Mesa / fondo -->
  <rect x="0" y="430" width="800" height="170" fill="#140C08"/>
  <ellipse cx="400" cy="452" rx="260" ry="26" fill="#000" opacity="0.45"/>

  <!-- Barra de chocolate (55% leche) -->
  <g transform="translate(400,300) rotate(-6)">
    <rect x="-230" y="-140" width="460" height="280" rx="14" fill="url(#choc)"/>
    <rect x="-230" y="-140" width="460" height="280" rx="14" fill="none" stroke="#D4AF37" stroke-opacity="0.45" stroke-width="3"/>
    <rect x="-214" y="-124" width="428" height="248" rx="8" fill="none" stroke="#D4AF37" stroke-opacity="0.18" stroke-width="1.5"/>

    <!-- Cuadrícula de la tableta -->
    <g stroke="#2E1B0E" stroke-width="4" opacity="0.85">
      <line x1="-115" y1="-124" x2="-115" y2="124"/>
      <line x1="0" y1="-124" x2="0" y2="124"/>
      <line x1="115" y1="-124" x2="115" y2="124"/>
      <line x1="-214" y1="-41" x2="214" y2="-41"/>
      <line x1="-214" y1="41" x2="214" y2="41"/>
    </g>

    <!-- Trocitos de arroz crujiente (Cruché) -->
    <g fill="#E8DCC0" stroke="#B9A47A" stroke-width="1.5">
      <rect x="-185" y="-105" width="34" height="20" rx="4" transform="rotate(-12 -168 -95)"/>
      <rect x="-60" y="-100" width="30" height="18" rx="4" transform="rotate(8 -45 -91)"/>
      <rect x="70" y="-108" width="36" height="20" rx="4" transform="rotate(-6 88 -98)"/>
      <rect x="-190" y="-25" width="28" height="17" rx="4" transform="rotate(6 -176 -16)"/>
      <rect x="-20" y="-30" width="34" height="19" rx="4" transform="rotate(-10 -3 -20)"/>
      <rect x="140" y="-28" width="30" height="18" rx="4" transform="rotate(12 155 -19)"/>
      <rect x="-150" y="62" width="32" height="18" rx="4" transform="rotate(-8 -134 71)"/>
      <rect x="30" y="58" width="36" height="20" rx="4" transform="rotate(5 48 68)"/>
      <rect x="175" y="60" width="28" height="16" rx="4" transform="rotate(-10 189 68)"/>
    </g>

    <!-- Brillo -->
    <ellipse cx="-120" cy="-80" rx="90" ry="34" fill="#FFF" opacity="0.05" transform="rotate(-18)"/>

    <!-- Etiqueta -->
    <rect x="-105" y="-22" width="210" height="58" rx="6" fill="#0F0907" stroke="#D4AF37" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#E8D3A3" letter-spacing="4">CRUNCHÉ</text>
    <text x="0" y="24" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#D4AF37" letter-spacing="5">55% CACAO</text>
  </g>

  <!-- Granos de arroz sueltos -->
  <g fill="#E8DCC0" stroke="#B9A47A" stroke-width="1.2" opacity="0.9">
    <rect x="120" y="470" width="30" height="17" rx="4" transform="rotate(14 135 478)"/>
    <rect x="620" y="490" width="27" height="16" rx="4" transform="rotate(-10 633 498)"/>
    <rect x="540" y="455" width="24" height="14" rx="4" transform="rotate(6 552 462)"/>
    <rect x="80" y="505" width="26" height="15" rx="4" transform="rotate(-6 93 512)"/>
  </g>
</svg>